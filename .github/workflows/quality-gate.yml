name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  db:
    name: Database (pgTAP RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Run pgTAP tests
        run: supabase test db
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
